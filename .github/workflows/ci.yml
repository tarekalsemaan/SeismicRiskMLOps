name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt

      - name: Check Python syntax
        run: |
          python -m compileall api dashboard src

      - name: Build FastAPI Docker image
        run: |
          docker build -f Dockerfile.api -t seismic-risk-api:test .

      - name: Build Streamlit Docker image
        run: |
          docker build -f Dockerfile.dashboard -t seismic-risk-dashboard:test .